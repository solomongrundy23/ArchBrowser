<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Страница недоступна</title>
<style>
  :root {
    /*__ARCH_THEME__*/
    --bg: #12141a;
    --panel: #191c24;
    --text: #e9ecf3;
    --muted: #9aa1b2;
    --line: #2a2f3a;
    --soft: #22262f;
    --danger: #ff8080;
    --accent: #7c8cff;
    --accent-contrast: #0b0d11;
    color-scheme: dark;
  }
  :root[data-mode="light"] {
    --bg: #f4f6fb;
    --panel: #ffffff;
    --text: #171a21;
    --muted: #61697a;
    --line: #e1e5ee;
    --soft: #eef1f7;
    --danger: #c62b2b;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background-image: radial-gradient(1100px 480px at 50% -12%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%);
  }
  .card {
    width: min(560px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px 28px 24px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .34);
  }
  .icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--danger) 16%, transparent);
    color: var(--danger);
    margin-bottom: 16px;
  }
  .icon svg { width: 26px; height: 26px; }
  h1 {
    margin: 0 0 6px;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -.01em;
  }
  .host {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 14px;
    overflow-wrap: anywhere;
  }
  .hint {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 16px;
  }
  .details {
    background: var(--soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Cascadia Mono", Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    overflow-wrap: anywhere;
    margin-bottom: 20px;
  }
  .details b { color: var(--text); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    font: inherit;
    font-size: 13.5px;
    font-weight: 550;
    padding: 9px 16px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--soft);
    color: var(--text);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .06s ease;
  }
  button:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-contrast);
  }
  button.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #ffffff); }
  .status {
    margin-top: 14px;
    font-size: 12.5px;
    color: var(--muted);
    min-height: 17px;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" id="icon"></div>
    <h1 id="title">Страница не отвечает</h1>
    <div class="host" id="host"></div>
    <div class="hint" id="hint"></div>
    <div class="details" id="details"></div>
    <div class="row">
      <button class="primary" id="retry">Повторить</button>
      <button id="vpn">Открыть через VPN</button>
      <button id="home">На главную</button>
    </div>
    <div class="status" id="status"></div>
  </main>
<script>
  const params = new URLSearchParams(location.search);
  const kind = params.get('kind') || 'net';
  const target = params.get('url') || '';
  const code = params.get('code') || '';
  const desc = params.get('desc') || '';

  const CLOUD_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l20 20"/><path d="M5.8 9.4A5 5 0 0 0 7 19h9.5"/><path d="M9.5 5.3A6.5 6.5 0 0 1 19 11.5 4.2 4.2 0 0 1 18.6 19"/></svg>';
  const CLOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg>';

  let hostText = '';
  try {
    const u = new URL(target);
    hostText = u.host || u.href;
  } catch {
    hostText = target;
  }

  document.getElementById('icon').innerHTML = kind === 'timeout' ? CLOCK : CLOUD_OFF;
  document.title = kind === 'timeout' ? 'Страница не отвечает' : 'Не удалось открыть страницу';
  document.getElementById('title').textContent = kind === 'timeout'
    ? 'Страница не отвечает'
    : 'Не удалось открыть страницу';
  document.getElementById('host').textContent = hostText;
  document.getElementById('hint').textContent = kind === 'timeout'
    ? 'Сайт не ответил за 30 секунд. Возможно, он недоступен или соединение блокируется провайдером.'
    : 'Браузер не смог установить соединение с сайтом. Проверьте адрес и подключение к интернету.';

  const detailParts = [];
  if (code) detailParts.push(`<b>Код:</b> ${String(code).replace(/[<>&]/g, '')}`);
  if (desc) detailParts.push(`<b>Причина:</b> ${String(desc).replace(/[<>&]/g, '')}`);
  if (target) detailParts.push(String(target).replace(/[<>&]/g, ''));
  document.getElementById('details').innerHTML = detailParts.join('<br>');

  const status = document.getElementById('status');

  document.getElementById('retry').addEventListener('click', () => {
    if (!target) {
      location.href = 'arch://newtab';
      return;
    }
    status.textContent = 'Повторная загрузка…';
    location.href = target;
  });

  document.getElementById('vpn').addEventListener('click', async () => {
    status.textContent = 'Направляю сайт через VPN…';
    try {
      if (window.archHost && window.archHost.retryThroughVpn) {
        const ok = await window.archHost.retryThroughVpn(target);
        if (!ok) status.textContent = 'Не удалось переключить маршрут — проверьте, что VPN подключён.';
        return;
      }
    } catch (e) {
      status.textContent = 'Ошибка: ' + (e && e.message ? e.message : e);
      return;
    }
    location.href = target || 'arch://newtab';
  });

  document.getElementById('home').addEventListener('click', () => {
    location.href = 'arch://newtab';
  });
</script>
</body>
</html>
