<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: arch:; form-action https:; worker-src 'self';">
<title>Новая вкладка</title>
<script>
  (() => {
    const mq = matchMedia('(prefers-color-scheme: light)');
    const apply = () => {
      // До прихода темы от главного процесса используем системную.
      document.documentElement.dataset.mode = mq.matches ? 'light' : 'dark';
    };
    apply();
    mq.addEventListener('change', apply);
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #1a1a1a;
    --text: #f2f2f2;
    --muted: #a0a0a0;
    --accent: #60cdff;
    --accent-contrast: #06131a;
    /*__ARCH_THEME__*/
    --card: rgba(37, 37, 37, .68);
    --card-solid: #242424;
    --border: rgba(65, 65, 65, .72);
    --input-bg: rgba(30, 30, 30, .86);
    --input-stroke: #7a7a7a;
    --placeholder: #7a7a7a;
    --link-text: #d0d0d0;
    --link-hover-bg: rgba(54, 54, 54, .94);
    --link-hover-text: #ffffff;
    --dot-bg: #303030;
    --dot-text: #d6d6d6;
    --pill-text: color-mix(in srgb, var(--accent) 72%, #e8e8e8);
    --hint: #858585;
    --hint-b: #b8b8b8;
    --hero-blue: rgba(96, 205, 255, .08);
    --hero-purple: rgba(255, 255, 255, .035);
    --shadow: rgba(0, 0, 0, .36);
    --danger: #ff8c8c;
  }
  :root[data-mode="light"] {
    color-scheme: light;
    --bg: #f3f3f3;
    --text: #1b1b1b;
    --muted: #616161;
    --card: rgba(255, 255, 255, .76);
    --card-solid: #ffffff;
    --border: rgba(207, 207, 207, .9);
    --input-bg: rgba(255, 255, 255, .92);
    --input-stroke: #8a8a8a;
    --placeholder: #7e7e7e;
    --link-text: #3b3b3b;
    --link-hover-bg: #ffffff;
    --link-hover-text: #000000;
    --dot-bg: #ededed;
    --dot-text: #4a4a4a;
    --pill-text: color-mix(in srgb, var(--accent) 64%, #343434);
    --hint: #6b6b6b;
    --hint-b: #3f3f3f;
    --hero-blue: rgba(0, 103, 192, .06);
    --hero-purple: rgba(0, 0, 0, .025);
    --shadow: rgba(0, 0, 0, .18);
    --danger: #b42318;
  }

  /* Темы: задают оттенок поверхностей, а светлый/тёмный вариант выбирается
     отдельной настройкой. Поэтому у каждой темы есть оба режима. */
  :root[data-theme="original"] { --theme-tint: #9a9a9a; }
  :root[data-mode="light"][data-theme="original"] { --theme-tint: #7a7a7a; }
  :root[data-theme="accent"] { --theme-tint: var(--accent); }
  :root:is(
    [data-theme="accent"],
    [data-theme="cyberpunk"],
    [data-theme="neon"],
    [data-theme="umbrella"],
    [data-theme="gold"],
    [data-theme="newyear"],
    [data-theme="christmas"],
    [data-theme="feb14"],
    [data-theme="feb23"],
    [data-theme="mar8"],
    [data-theme="may1"],
    [data-theme="may9"],
    [data-theme="jun12"],
    [data-theme="nov4"],
    [data-theme="halloween"],
    [data-theme="winter"],
    [data-theme="summer"],
    [data-theme="autumn"],
    [data-theme="spring"],
    [data-theme="silenthill"],
    [data-theme="silver"]
  ) { --theme-tint: var(--accent); }
  :root[data-theme="newyear"],
  :root[data-theme="christmas"] { --theme-tint: var(--accent-2); }

  :root[data-mode="dark"]:is(
    [data-theme="accent"],
    [data-theme="cyberpunk"],
    [data-theme="neon"],
    [data-theme="umbrella"],
    [data-theme="gold"],
    [data-theme="newyear"],
    [data-theme="christmas"],
    [data-theme="feb14"],
    [data-theme="feb23"],
    [data-theme="mar8"],
    [data-theme="may1"],
    [data-theme="may9"],
    [data-theme="jun12"],
    [data-theme="nov4"],
    [data-theme="halloween"],
    [data-theme="winter"],
    [data-theme="summer"],
    [data-theme="autumn"],
    [data-theme="spring"],
    [data-theme="silenthill"],
    [data-theme="silver"]
  ) {
    --bg: color-mix(in srgb, var(--theme-tint) 8%, #101013);
    --card: color-mix(in srgb, var(--theme-tint) 9%, rgba(36, 36, 40, .72));
    --card-solid: color-mix(in srgb, var(--theme-tint) 9%, #232327);
    --border: color-mix(in srgb, var(--theme-tint) 24%, rgba(70, 70, 78, .72));
    --input-bg: color-mix(in srgb, var(--theme-tint) 8%, rgba(28, 28, 32, .88));
    --input-stroke: color-mix(in srgb, var(--theme-tint) 32%, #7a7a82);
    --placeholder: color-mix(in srgb, var(--theme-tint) 20%, #85858d);
    --link-text: color-mix(in srgb, var(--theme-tint) 12%, #d6d6dc);
    --link-hover-bg: color-mix(in srgb, var(--theme-tint) 18%, #323238);
    --link-hover-text: #ffffff;
    --dot-bg: color-mix(in srgb, var(--theme-tint) 14%, #2f2f35);
    --dot-text: color-mix(in srgb, var(--theme-tint) 10%, #dcdce2);
    --hint: color-mix(in srgb, var(--theme-tint) 16%, #85858d);
    --hint-b: color-mix(in srgb, var(--theme-tint) 12%, #b8b8c0);
    --hero-blue: color-mix(in srgb, var(--theme-tint) 18%, transparent);
    --hero-purple: color-mix(in srgb, var(--accent-2, var(--theme-tint)) 12%, transparent);
    --shadow: rgba(0, 0, 0, .5);
    --danger: #ff8c8c;
  }

  :root[data-mode="light"]:is(
    [data-theme="accent"],
    [data-theme="cyberpunk"],
    [data-theme="neon"],
    [data-theme="umbrella"],
    [data-theme="gold"],
    [data-theme="newyear"],
    [data-theme="christmas"],
    [data-theme="feb14"],
    [data-theme="feb23"],
    [data-theme="mar8"],
    [data-theme="may1"],
    [data-theme="may9"],
    [data-theme="jun12"],
    [data-theme="nov4"],
    [data-theme="halloween"],
    [data-theme="winter"],
    [data-theme="summer"],
    [data-theme="autumn"],
    [data-theme="spring"],
    [data-theme="silenthill"],
    [data-theme="silver"]
  ) {
    color-scheme: light;
    --bg: color-mix(in srgb, var(--theme-tint) 7%, #f7f7f9);
    --card: color-mix(in srgb, var(--theme-tint) 5%, rgba(255, 255, 255, .78));
    --card-solid: color-mix(in srgb, var(--theme-tint) 4%, #ffffff);
    --border: color-mix(in srgb, var(--theme-tint) 20%, rgba(207, 207, 213, .9));
    --input-bg: color-mix(in srgb, var(--theme-tint) 5%, rgba(255, 255, 255, .94));
    --input-stroke: color-mix(in srgb, var(--theme-tint) 34%, #8a8a92);
    --placeholder: color-mix(in srgb, var(--theme-tint) 24%, #7e7e86);
    --link-text: color-mix(in srgb, var(--theme-tint) 22%, #3b3b42);
    --link-hover-bg: color-mix(in srgb, var(--theme-tint) 12%, #ffffff);
    --link-hover-text: #000000;
    --dot-bg: color-mix(in srgb, var(--theme-tint) 10%, #ededf1);
    --dot-text: color-mix(in srgb, var(--theme-tint) 26%, #4a4a52);
    --hint: color-mix(in srgb, var(--theme-tint) 26%, #6b6b73);
    --hint-b: color-mix(in srgb, var(--theme-tint) 22%, #3f3f47);
    --hero-blue: color-mix(in srgb, var(--theme-tint) 14%, transparent);
    --hero-purple: color-mix(in srgb, var(--accent-2, var(--theme-tint)) 10%, transparent);
    --shadow: rgba(0, 0, 0, .16);
    --danger: #b42318;
  }
  /* AMOLED — истинно чёрный фон без серой заливки. */
  :root[data-theme="amoled"] {
    color-scheme: dark;
    --theme-tint: #000000;
    --bg: #000000;
    --card: rgba(12, 12, 12, .74);
    --card-solid: #0a0a0a;
    --border: #242424;
    --input-bg: rgba(10, 10, 10, .92);
    --input-stroke: #3a3a3a;
    --placeholder: #6a6a6a;
    --link-text: #d8d8d8;
    --link-hover-bg: #171717;
    --link-hover-text: #ffffff;
    --dot-bg: #101010;
    --dot-text: #e8e8e8;
    --hint: #6f6f6f;
    --hint-b: #c8c8c8;
    --hero-blue: color-mix(in srgb, var(--accent) 14%, transparent);
    --hero-purple: color-mix(in srgb, var(--accent-2, var(--accent)) 10%, transparent);
    --shadow: rgba(0, 0, 0, .85);
    --danger: #ff8c8c;
  }
  /* Silent Hill — туман и ржавчина. */
  :root[data-theme="silenthill"] body,
  :root[data-theme="silenthill"] {
    background:
      radial-gradient(95vw 72vh at 8% -12%, color-mix(in srgb, #a8b5a2 22%, transparent), transparent 70%),
      radial-gradient(80vw 60vh at 102% 8%, color-mix(in srgb, #c0503a 14%, transparent), transparent 70%),
      radial-gradient(120vw 76vh at 50% 116%, color-mix(in srgb, #4b4a42 18%, transparent), transparent 74%),
      var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }

  * { box-sizing: border-box; }
  html { height: 100%; min-height: 100%; margin: 0; background-color: var(--bg); }
  html, body { margin: 0; }
  body {
    /* Фон держим на html и фиксируем к окну: так он гарантированно
       заполняет всю высоту при любом размере окна и не обрывается при
       прокрутке длинной новой вкладки. Размеры градиентов заданы в vw/vh,
       поэтому картинка одинаково хорошо смотрится и в узком, и в очень
       широком окне. */
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--text);
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(120vw 72vh at 50% -16%, var(--hero-blue), transparent 70%),
      radial-gradient(88vw 56vh at 104% 108%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 72%),
      radial-gradient(80vw 52vh at -4% 106%, var(--hero-purple), transparent 72%),
      radial-gradient(120vw 60vh at 50% 116%, color-mix(in srgb, var(--accent-2, var(--accent)) 7%, transparent), transparent 74%),
      var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-font-smoothing: antialiased;
  }
  html {
    background:
      radial-gradient(120vw 72vh at 50% -16%, var(--hero-blue), transparent 70%),
      radial-gradient(88vw 56vh at 104% 108%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 72%),
      radial-gradient(80vw 52vh at -4% 106%, var(--hero-purple), transparent 72%),
      radial-gradient(120vw 60vh at 50% 116%, color-mix(in srgb, var(--accent-2, var(--accent)) 7%, transparent), transparent 74%),
      var(--bg);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }
  @supports (min-height: 100dvh) {
    body { min-height: 100dvh; }
  }
  /* Неон: голубая левая половина и розовая правая. */
  :root[data-theme="neon"] body,
  :root[data-theme="neon"] {
    background:
      radial-gradient(70vw 62vh at 0% 6%, color-mix(in srgb, #22d3ee 30%, transparent), transparent 68%),
      radial-gradient(70vw 62vh at 100% 10%, color-mix(in srgb, #ff4fa3 30%, transparent), transparent 68%),
      linear-gradient(100deg,
        color-mix(in srgb, #22d3ee 16%, var(--bg)) 0%,
        var(--bg) 48%,
        color-mix(in srgb, #ff4fa3 16%, var(--bg)) 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }
  /* Киберпанк: жёлтый слева, голубой справа. */
  :root[data-theme="cyberpunk"] body,
  :root[data-theme="cyberpunk"] {
    background:
      radial-gradient(72vw 62vh at 0% 2%, color-mix(in srgb, #ffd60a 26%, transparent), transparent 68%),
      radial-gradient(72vw 62vh at 100% 8%, color-mix(in srgb, #3b82f6 30%, transparent), transparent 68%),
      linear-gradient(100deg,
        color-mix(in srgb, #ffd60a 10%, var(--bg)) 0%,
        var(--bg) 48%,
        color-mix(in srgb, #3b82f6 15%, var(--bg)) 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }
  .wrap {
    width: min(900px, 92vw);
    flex: 1 0 auto;
    min-height: 100%;
    min-height: 100dvh;
    margin: 0 auto;
    padding: clamp(22px, 6vh, 72px) 0 clamp(26px, 5vh, 58px);
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: appear .45s ease both;
  }
  @media (max-height: 720px) {
    .wrap { justify-content: flex-start; }
  }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } }

  .logo {
    width: 192px; height: 192px;
    margin: 0 auto 2px;
    display: flex; align-items: center; justify-content: center;
    filter: drop-shadow(0 16px 34px var(--shadow));
    animation: logo-float 8s ease-in-out infinite;
    position: relative;
    isolation: isolate;
  }
  .logo img { width: 100%; height: 100%; display: block; object-fit: contain; position: relative; z-index: 1; }
  .logo-umbrella { display: none; width: 100%; height: 100%; position: relative; z-index: 1; }
  :root[data-theme="umbrella"] .logo-default { display: none; }
  :root[data-theme="umbrella"] .logo-umbrella { display: block; }
  :root[data-theme="umbrella"] .logo::before {
    background: radial-gradient(circle at 50% 50%,
      color-mix(in srgb, #e53935 72%, transparent) 0%,
      color-mix(in srgb, #e53935 28%, transparent) 42%,
      transparent 70%);
  }
  /* Подсветка акцентным цветом операционной системы с медленной пульсацией. */
  .logo::before {
    content: '';
    position: absolute;
    inset: -22%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%,
      color-mix(in srgb, var(--accent) 68%, transparent) 0%,
      color-mix(in srgb, var(--accent) 30%, transparent) 40%,
      transparent 70%);
    filter: blur(18px);
    opacity: .45;
    animation: logo-pulse 4.6s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes logo-pulse {
    0%, 100% { opacity: .30; transform: scale(.80); }
    50%      { opacity: 1;   transform: scale(1.20); }
  }
  @keyframes logo-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }

  #clock { font-size: 64px; font-weight: 220; letter-spacing: -3px; line-height: 1; }
  #date { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  #greeting { margin-top: 5px; color: var(--muted); font-size: 12px; opacity: .82; }

  form {
    margin: 24px auto 0;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 30px color-mix(in srgb, #000 13%, transparent);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    max-width: 660px;
  }
  form:focus-within {
    border-color: color-mix(in srgb, var(--accent) 58%, transparent);
    background: var(--input-bg);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 10%, transparent),
                0 12px 38px color-mix(in srgb, #000 16%, transparent);
  }
  form svg { width: 18px; height: 18px; fill: none; stroke: var(--input-stroke); stroke-width: 2; stroke-linecap: round; }
  #q {
    flex: 1; height: 100%;
    background: transparent; border: 0; outline: 0;
    color: var(--text); font-size: 15px;
    font-family: inherit;
  }
  #q::placeholder { color: var(--placeholder); }

  .links {
    margin-top: 25px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .link {
    width: 74px;
    padding: 5px 4px;
    border-radius: 14px;
    color: var(--link-text);
    text-decoration: none;
    font-size: 11.5px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    transition: transform .14s ease, color .14s ease;
  }
  .link:hover { transform: translateY(-2px); color: var(--link-hover-text); }
  .link .dot {
    width: 48px; height: 48px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--dot-text);
    font-weight: 650; font-size: 17px;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 16px color-mix(in srgb, #000 10%, transparent);
    transition: background .14s ease, border-color .14s ease;
  }
  .link:hover .dot { background: var(--link-hover-bg); border-color: color-mix(in srgb, var(--accent) 28%, transparent); }
  .link-position { position: relative; }

  /* Добавление ссылки: спокойная плитка вместо кнопок, выскакивающих
     при наведении. Редактирование и удаление — в контекстном меню. */
  .link-add {
    width: 48px; height: 48px;
    border-radius: 15px;
    border: 1px dashed color-mix(in srgb, var(--accent) 42%, var(--border));
    background: color-mix(in srgb, var(--card) 55%, transparent);
    color: color-mix(in srgb, var(--accent) 80%, var(--muted));
    font: inherit; font-size: 22px; font-weight: 300; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .14s ease, border-color .14s ease, color .14s ease;
    margin-top: 0;
  }
  .link-add:hover { background: var(--link-hover-bg); border-color: var(--accent); color: var(--accent); }
  .link-add-position {
    width: 74px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    padding: 5px 4px;
  }
  .link-add-title { font-size: 11.5px; color: var(--muted); }

  /* Контекстное меню ссылок. */
  .ctx-menu {
    position: fixed;
    z-index: 300;
    min-width: 210px;
    padding: 5px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-solid);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .38);
    animation: ctx-in .12s ease both;
  }
  @keyframes ctx-in { from { opacity: 0; transform: scale(.97); } }
  .ctx-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; height: 32px; padding: 0 10px;
    border: 0; border-radius: 8px; background: transparent;
    color: var(--text); font: inherit; font-size: 12.5px; text-align: left;
    cursor: pointer;
  }
  .ctx-item:hover { background: var(--link-hover-bg); }
  .ctx-item.danger { color: #ff6b6b; }
  .ctx-sep { height: 1px; margin: 5px 6px; background: var(--border); }
  .modal-error { min-height: 16px; color: #ff6b6b; font-size: 11.5px; margin-top: 2px; }

  /* ---------- Link edit modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    animation: modal-in .18s ease both;
  }
  @keyframes modal-in { from { opacity: 0; } }
  .modal-card {
    width: min(420px, 90vw);
    padding: 22px 20px 18px;
    border-radius: 20px;
    background: var(--card-solid);
    border: 1px solid var(--border);
    box-shadow: 0 24px 60px var(--shadow);
  }
  .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; }
  .modal-desc { font-size: 12.5px; line-height: 1.55; color: var(--muted); margin-bottom: 4px; }
  .modal-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .modal-field label { font-size: 11.5px; color: var(--muted); }
  .modal-field input {
    height: 36px; padding: 0 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--input-bg);
    color: var(--text); font: inherit; font-size: 13px; outline: 0;
  }
  .modal-field input:focus { border-color: var(--focus-border); }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal-actions .mini-btn { height: 36px; font-size: 12.5px; }

  /* ---------- RSS-ленты ---------- */
  .rss {
    margin: 24px auto 0;
    max-width: 720px;
    text-align: left;
  }
  .rss[hidden] { display: none; }
  .rss-head {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .35px;
    text-transform: uppercase;
  }
  .rss-head svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .rss-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .rss-item {
    display: grid;

<script>
  const pad = (n) => String(n).padStart(2, '0');
  const STORAGE_TIMER = 'arch.timer.v1';
  const STORAGE_ALARMS = 'arch.alarms.v1';
  let alarms = [];

  /* ---------- RSS-ленты ---------- */
  function renderRss(items) {
    const block = document.getElementById('rss');
    const list = document.getElementById('rss-list');
    if (!block || !list) return;
    const rows = Array.isArray(items) ? items.filter((i) => i && i.title) : [];
    block.hidden = rows.length === 0;
    if (!rows.length) {
      list.innerHTML = '';
      return;
    }
    list.innerHTML = rows.slice(0, 12).map((item) => `
      <a class="rss-item" href="${esc(item.link || '#')}" target="_blank" rel="noreferrer">
        <span class="rss-title">${esc(item.title)}</span>
        ${item.description ? `<span class="rss-desc">${esc(item.description)}</span>` : ''}
        <span class="rss-time">${item.date ? formatRssTime(item.date) : ''}</span>
      </a>`).join('');
  }

  function formatRssTime(stamp) {
    const diff = Date.now() - stamp;
    if (diff < 3600000) return `${Math.max(1, Math.round(diff / 60000))} мин`;
    if (diff < 86400000) return `${Math.round(diff / 3600000)} ч`;
    if (diff < 7 * 86400000) return `${Math.round(diff / 86400000)} дн`;
    return new Date(stamp).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  }

  window.addEventListener('arch-rss', (event) => renderRss(event.detail || []));

  /* ---------- праздничный блок ---------- */
  // Показывается в новогодней и рождественской темах. Когда до праздника
  // меньше суток, счётчик переключается на часы, затем минуты и секунды.
  function plural(n, one, few, many) {
    const abs = Math.abs(n) % 100;
    const last = abs % 10;
    if (abs > 10 && abs < 20) return many;
    if (last > 1 && last < 5) return few;
    if (last === 1) return one;
    return many;
  }

  /* ---------- Праздничные темы: символ и обратный отсчёт ---------- */
  const FESTIVE = {
    newyear: { month: 1, day: 1, title: 'Новый год', label: 'Нового года', greeting: 'С наступающим!' },
    christmas: { month: 1, day: 7, title: 'Рождество', label: 'Рождества', greeting: 'С Рождеством!' },
    feb14: { month: 2, day: 14, title: 'День всех влюблённых', label: '14 февраля', greeting: 'С Днём всех влюблённых!' },
    feb23: { month: 2, day: 23, title: 'День защитника Отечества', label: '23 февраля', greeting: 'С Днём защитника Отечества!' },
    mar8: { month: 3, day: 8, title: 'Международный женский день', label: '8 марта', greeting: 'С 8 Марта!' },
    may1: { month: 5, day: 1, title: 'Праздник Весны и Труда', label: '1 мая', greeting: 'С Праздником Весны и Труда!' },
    may9: { month: 5, day: 9, title: 'День Победы', label: '9 мая', greeting: 'С Днём Победы!' },
    jun12: { month: 6, day: 12, title: 'День России', label: '12 июня', greeting: 'С Днём России!' },
    nov4: { month: 11, day: 4, title: 'День народного единства', label: '4 ноября', greeting: 'С Днём народного единства!' },
    halloween: { month: 10, day: 31, title: 'Хэллоуин', label: 'Хэллоуина', greeting: 'С Хэллоуином!' },
  };

  // Символ праздника. Ёлка остаётся только у Нового года, у Рождества —
  // крест и звезда, у остальных — свой тематический знак.
  function festiveSvg(name) {
    if (name === 'christmas') {
      return `<svg viewBox="0 0 104 132">
        <defs><radialGradient id="arch-halo"><stop offset="0" stop-color="#ffe9a3" stop-opacity=".85"/><stop offset="1" stop-color="#ffd447" stop-opacity="0"/></radialGradient></defs>
        <circle cx="52" cy="62" r="48" fill="url(#arch-halo)"/>
        <rect x="45" y="18" width="14" height="100" rx="4" fill="#f3e3bd"/>
        <rect x="22" y="48" width="60" height="14" rx="4" fill="#f3e3bd"/>
        <circle cx="52" cy="55" r="7" fill="#c1121f"/>
        <path d="M52 2l3.4 9.6L65 15l-9.6 3.4L52 28l-3.4-9.6L39 15l9.6-3.4z" fill="#ffd447"/>
      </svg>`;
    }
    if (name === 'feb14') {
      return `<svg viewBox="0 0 104 132">
        <path d="M52 110C25 90 13 73 13 54c0-15 11-26 25-26 7 0 12 3 14 9 3-6 8-9 15-9 14 0 25 11 25 26 0 19-12 36-40 56z" fill="#ff4d8d"/>
        <path d="M52 110C25 90 13 73 13 54c0-15 11-26 25-26 7 0 12 3 14 9" fill="none" stroke="#ff9ec4" stroke-width="3"/>
        <path d="M18 30L86 100" stroke="#ffd0e2" stroke-width="4" stroke-linecap="round"/>
        <path d="M86 82l10 22-23-4z" fill="#ffd0e2"/>
      </svg>`;
    }
    if (name === 'feb23') {
      return `<svg viewBox="0 0 104 132">
        <path d="M52 8l12 28 31 3-23 21 7 31-27-16-27 16 7-31L9 39l31-3z" fill="#e0b34a"/>
        <path d="M52 8l12 28 31 3-23 21 7 31-27-16z" fill="#f0c96a" opacity=".55"/>
        <rect x="34" y="102" width="36" height="9" rx="4" fill="#4f6b4a"/>
        <rect x="40" y="113" width="24" height="9" rx="4" fill="#c0392b"/>
      </svg>`;
    }
    if (name === 'mar8') {
      return `<svg viewBox="0 0 104 132">
        <rect x="49.5" y="66" width="5" height="52" rx="2.5" fill="#4f9d5a"/>
        <path d="M52 96C34 96 26 87 25 78c16 0 27 7 27 18z" fill="#5cb56b"/>
        <g fill="#ff6fa5">
          <ellipse cx="52" cy="20" rx="10" ry="15"/>
          <ellipse cx="52" cy="68" rx="10" ry="15"/>
          <ellipse cx="28" cy="44" rx="15" ry="10"/>
          <ellipse cx="76" cy="44" rx="15" ry="10"/>
        </g>
        <g fill="#ff9ec4">
          <ellipse cx="35" cy="27" rx="9" ry="13" transform="rotate(-45 35 27)"/>
          <ellipse cx="69" cy="27" rx="9" ry="13" transform="rotate(45 69 27)"/>
          <ellipse cx="35" cy="61" rx="9" ry="13" transform="rotate(45 35 61)"/>
          <ellipse cx="69" cy="61" rx="9" ry="13" transform="rotate(-45 69 61)"/>
        </g>
        <circle cx="52" cy="44" r="12" fill="#ffd447"/>
      </svg>`;
    }
    if (name === 'may1') {
      return `<svg viewBox="0 0 104 132">
        <circle cx="52" cy="38" r="22" fill="#ffd447"/>
        <g stroke="#ffd447" stroke-width="4" stroke-linecap="round">
          <path d="M52 6v8M20 22l6 6M84 22l-6 6M12 50h8M92 50h-8"/>
        </g>
        <rect x="49.5" y="60" width="5" height="60" rx="2.5" fill="#4f9d5a"/>
        <path d="M52 78C34 78 22 68 20 52c18 0 32 10 32 26z" fill="#6fbf73"/>
        <path d="M55 90c18 0 30-10 32-26-18 0-32 10-32 26z" fill="#3f8f4a"/>
      </svg>`;
    }
    if (name === 'may9') {
      return `<svg viewBox="0 0 104 132">
        <path d="M34 18h36l-5 98H39z" fill="#f0a02a"/>
        <path d="M44 18h8l-2 98h-6zM58 18h8l2 98h-6z" fill="#262626" opacity=".82"/>
        <path d="M34 18h36l-1 18H35z" fill="#d98a1d"/>
        <path d="M52 26l4.2 10 10.8 1-8 7 2.4 10.8-9.4-5.6-9.4 5.6L45 44l-8-7 10.8-1z" fill="#f5c542" stroke="#fff8dc" stroke-width="1.5"/>
      </svg>`;
    }
    if (name === 'jun12' || name === 'nov4') {
      const shield = name === 'nov4';
      if (shield) {
        return `<svg viewBox="0 0 104 132">
          <defs><clipPath id="arch-shield"><path d="M52 8l40 13v35c0 31-24 52-40 63-16-11-40-32-40-63V21z"/></clipPath></defs>
          <g clip-path="url(#arch-shield)">
            <rect x="8" y="4" width="88" height="38" fill="#f7f7f7"/>
            <rect x="8" y="42" width="88" height="38" fill="#2f6fd0"/>
            <rect x="8" y="80" width="88" height="52" fill="#e63946"/>
          </g>
          <path d="M52 8l40 13v35c0 31-24 52-40 63-16-11-40-32-40-63V21z" fill="none" stroke="#cfcfd6" stroke-width="3"/>
          <path d="M52 42l5 14 15 1-12 9 4 15-12-8-12 8 4-15-12-9 15-1z" fill="#ffd447"/>
        </svg>`;
      }
      return `<svg viewBox="0 0 104 132">
        <defs><clipPath id="arch-flag"><rect x="14" y="20" width="76" height="92" rx="10"/></clipPath></defs>
        <g clip-path="url(#arch-flag)">
          <rect x="14" y="20" width="76" height="31" fill="#f7f7f7"/>
          <rect x="14" y="51" width="76" height="30" fill="#2f6fd0"/>
          <rect x="14" y="81" width="76" height="31" fill="#e63946"/>
        </g>
        <rect x="14" y="20" width="76" height="92" rx="10" fill="none" stroke="#cfcfd6" stroke-width="2.5"/>
        <path d="M14 20c20 8 56 8 76 0v14c-20 8-56 8-76 0z" fill="#ffffff" opacity=".18"/>
      </svg>`;
    }
    if (name === 'halloween') {
      return `<svg viewBox="0 0 104 132">
        <path d="M52 40c-4-12 0-18 8-20" fill="none" stroke="#4f7d3a" stroke-width="7" stroke-linecap="round"/>
        <ellipse cx="52" cy="80" rx="42" ry="36" fill="#ff8c1a"/>
        <ellipse cx="52" cy="80" rx="31" ry="35" fill="#ffa42e"/>
        <ellipse cx="52" cy="80" rx="42" ry="36" fill="none" stroke="#d96f0a" stroke-width="2"/>
        <path d="M30 70l16 9-16 9zM74 70l-16 9 16 9z" fill="#2a1503"/>
        <path d="M30 98q22 16 44 0" fill="none" stroke="#2a1503" stroke-width="5" stroke-linecap="round"/>
        <path d="M40 100l4 7 4-7zM56 100l4 7 4-7z" fill="#2a1503"/>
        <g fill="#8b5cf6" opacity=".55">
          <circle cx="18" cy="36" r="2.5"/><circle cx="88" cy="30" r="2"/><circle cx="90" cy="60" r="2.5"/><circle cx="14" cy="70" r="2"/>
        </g>
      </svg>`;
    }
    return '';
  }

  function renderFestive() {
    const block = document.getElementById('festive');
    if (!block) return;
    const name = document.documentElement.dataset.theme || '';
    const meta = FESTIVE[name];
    block.hidden = !meta;
    if (!meta) return;

    const tree = document.getElementById('festive-tree');
    const emblem = document.getElementById('festive-emblem');
    if (tree && emblem) {
      const showTree = name === 'newyear';
      tree.classList.toggle('hidden', !showTree);
      emblem.classList.toggle('hidden', showTree);
      if (!showTree && emblem.dataset.theme !== name) {
        emblem.innerHTML = festiveSvg(name);
        emblem.dataset.theme = name;
      }
    }

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let target = new Date(now.getFullYear(), meta.month - 1, meta.day);
    const dayDiff = Math.round((today.getTime() - target.getTime()) / 86400000);
    if (dayDiff > 7) target = new Date(now.getFullYear() + 1, meta.month - 1, meta.day);

    const diff = Math.max(0, target.getTime() - Date.now());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor(diff / 3600000) % 24;
    const minutes = Math.floor(diff / 60000) % 60;
    const seconds = Math.floor(diff / 1000) % 60;

    let value;
    let unit;
    if (days >= 1) {
      value = days;
      unit = plural(days, 'день', 'дня', 'дней');
    } else if (hours >= 1) {
      value = hours;
      unit = plural(hours, 'час', 'часа', 'часов');
    } else if (minutes >= 1) {
      value = minutes;
      unit = plural(minutes, 'минута', 'минуты', 'минут');
    } else {
      value = seconds;
      unit = plural(seconds, 'секунда', 'секунды', 'секунд');
    }

    const daysEl = document.getElementById('festive-days');
    const labelEl = document.getElementById('festive-label');
    const subEl = document.getElementById('festive-sub');
    const when = target.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    if (dayDiff === 0) {
      if (daysEl) daysEl.textContent = '★';
      if (labelEl) labelEl.textContent = `Сегодня — ${meta.title}`;
      if (subEl) subEl.textContent = `${meta.greeting} · ${when}`;
      return;
    }
    if (dayDiff > 0 && dayDiff <= 7) {
      if (daysEl) daysEl.textContent = '✓';
      if (labelEl) labelEl.textContent = meta.title;
      if (subEl) subEl.textContent = `${when} · ${meta.greeting}`;
      return;
    }
    if (daysEl) daysEl.textContent = String(value);
    if (labelEl) labelEl.textContent = `${unit} до ${meta.label}`;
    if (subEl) subEl.textContent = `${when} · ${meta.greeting}`;
  }
  window.addEventListener('arch-theme', () => renderFestive());
  renderFestive();
  setInterval(renderFestive, 1000);

  /* ---------- публикация состояния в основное окно ---------- */
  // Основное окно показывает таймер и ближайший будильник перед кнопкой VPN.
  function nextAlarmTime() {
    const enabled = alarms.filter((a) => a && a.enabled !== false && a.time);
    if (!enabled.length) return '';
    return enabled.map((a) => a.time).sort()[0] || '';
  }
  let lastPublishedState = '';
  function publishHostState() {
    try {
      const bridge = window.archHost;
      if (!bridge || typeof bridge.publishTimer !== 'function') return;
      const running = !!timer.endAt;
      const left = running ? timerLeft() : 0;
      const state = {
        running,
        left,
        label: running ? fmt(left) : '',
        alarm: nextAlarmTime(),
      };
      // Публикуем только при изменении: иначе несколько открытых новых вкладок
      // пересылают состояние по очереди и индикатор в панели мигает.
      const json = JSON.stringify(state);
      if (json === lastPublishedState) return;
      lastPublishedState = json;
      bridge.publishTimer(state);
    } catch {}
  }

  const clock = document.getElementById('clock');
  const dateEl = document.getElementById('date');
  const greeting = document.getElementById('greeting');
  const input = document.getElementById('q');

  function tickClock() {
    const now = new Date();
    clock.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    try {
      dateEl.textContent = now.toLocaleDateString('ru-RU', {
        weekday: 'long', day: 'numeric', month: 'long',
      });
    } catch {
      dateEl.textContent = now.toLocaleDateString('ru-RU');
    }
    const h = now.getHours();
    let text = 'Доброй ночи';
    if (h >= 5 && h < 12) text = 'Доброе утро';
    else if (h >= 12 && h < 18) text = 'Добрый день';
    else if (h >= 18 && h < 23) text = 'Добрый вечер';
    greeting.textContent = text + '. Здесь вас не отслеживают.';
  }
  tickClock();
  setInterval(tickClock, 1000);

  /* ---------- звук ---------- */
  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch { audioCtx = null; }
    return audioCtx;
  }
  let ringInterval = null;
  function beep() {
    const ctx = ensureAudio();
    if (!ctx) return;
    try {
      if (ctx.state === 'suspended') ctx.resume();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.42);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.45);
    } catch {}
  }

  const ring = document.getElementById('ring');
  const ringTitle = document.getElementById('ring-title');
  const ringSub = document.getElementById('ring-sub');
  function showRing(title, sub, options = {}) {
    ringTitle.textContent = title;
    ringSub.textContent = sub || '';
    ring.classList.add('show');
    document.title = title + ' — ArchBrowser';
    beep();
    clearInterval(ringInterval);
    ringInterval = setInterval(beep, 1300);
    setTimeout(() => clearInterval(ringInterval), 60000);
    // Предложение отключить сработавший будильник.
    const disableBtn = document.getElementById('ring-disable');
    if (disableBtn) {
      if (typeof options.onDisable === 'function') {
        disableBtn.classList.remove('hidden');
        disableBtn.onclick = () => {
          try {
            options.onDisable();
          } catch {}
          hideRing();
        };
      } else {
        disableBtn.classList.add('hidden');
        disableBtn.onclick = null;
      }
    }
  }
  function hideRing() {
    ring.classList.remove('show');
    clearInterval(ringInterval);
    ringInterval = null;
    document.title = 'Новая вкладка';
  }
  document.getElementById('ring-stop').addEventListener('click', hideRing);
  ring.addEventListener('click', (event) => {
    if (event.target === ring) hideRing();
  });

  /* ---------- таймер ---------- */
  const STORAGE_PRESETS = 'arch.timer.presets.v1';
  const timerDisplay = document.getElementById('timer-display');
  const timerMin = document.getElementById('timer-min');
  const timerStart = document.getElementById('timer-start');
  const timerBar = document.getElementById('timer-bar');
  const timerPresetsEl = document.getElementById('timer-presets');
  let timer = { endAt: 0, remaining: 5 * 60 * 1000, total: 5 * 60 * 1000 };
  let presets = [10, 45, 60];

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_TIMER) || 'null');
    if (saved && Number(saved.total) > 0) {
      timer = { endAt: Number(saved.endAt) || 0, remaining: Number(saved.remaining) || 0, total: Number(saved.total) || 0 };
    }
  } catch {}

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_PRESETS) || 'null');
    if (Array.isArray(saved)) {
      const clean = saved
        .map((m) => Math.round(Number(m) || 0))
        .filter((m) => m >= 1 && m <= 999);
      if (clean.length) presets = clean.slice(0, 6);
    }
  } catch {}

  function saveTimer() {
    try { localStorage.setItem(STORAGE_TIMER, JSON.stringify(timer)); } catch {}
  }
  function savePresets() {
    try { localStorage.setItem(STORAGE_PRESETS, JSON.stringify(presets)); } catch {}
  }
  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function timerLeft() {
    return timer.endAt ? Math.max(0, timer.endAt - Date.now()) : Math.max(0, timer.remaining);
  }
  function presetLabel(minutes) {
    if (minutes >= 60 && minutes % 60 === 0) {
      const h = minutes / 60;
      return `${h} ${h === 1 ? 'час' : (h < 5 ? 'часа' : 'часов')}`;
    }
    return `${minutes} мин`;
  }
  function editPreset(index) {
    const current = presets[index];
    if (!current) return;
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal-card">
        <div class="modal-title">Изменить пресет</div>
        <div class="modal-field">
          <label>Минут</label>
          <input type="number" id="preset-min" min="1" max="999" value="${esc(String(current))}">
        </div>
        <div class="modal-actions">
          <button class="mini-btn" id="preset-cancel">Отмена</button>
          <button class="mini-btn primary" id="preset-save">Сохранить</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    const input = modal.querySelector('#preset-min');
    const close = () => modal.remove();
    input.focus();
    input.select();
    modal.querySelector('#preset-cancel').addEventListener('click', close);
    modal.querySelector('#preset-save').addEventListener('click', () => {
      const value = Math.round(Number(input.value) || 0);
      if (value >= 1 && value <= 999) {
        presets[index] = value;
        savePresets();
        renderPresets();
      }
      close();
    });
    modal.addEventListener('click', (e) => { if (e.target === modal) close(); });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); modal.querySelector('#preset-save').click(); }
      if (e.key === 'Escape') { e.preventDefault(); close(); }
    });
  }
  function renderPresets() {
    if (!timerPresetsEl) return;
    timerPresetsEl.innerHTML = presets.map((minutes, index) => `
      <span class="preset">
        <button class="preset-btn" data-preset-set="${index}" title="Запустить ${esc(presetLabel(minutes))}">${esc(presetLabel(minutes))}</button>
        <button class="preset-edit" data-preset-edit="${index}" title="Изменить пресет">✎</button>
      </span>
    `).join('');
    timerPresetsEl.querySelectorAll('[data-preset-set]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const minutes = presets[Number(btn.dataset.presetSet)];
        if (!minutes) return;
        ensureAudio();
        timerMin.value = String(minutes);
        timer.total = minutes * 60 * 1000;
        timer.remaining = timer.total;
        timer.endAt = Date.now() + timer.remaining;
        saveTimer();
        renderTimer();
      });
    });
    timerPresetsEl.querySelectorAll('[data-preset-edit]').forEach((btn) => {
      btn.addEventListener('click', () => editPreset(Number(btn.dataset.presetEdit)));
    });
  }
  function renderTimer() {
    const left = timerLeft();
    timerDisplay.textContent = fmt(left);
    timerDisplay.classList.toggle('running', !!timer.endAt);
    timerBar.style.width = `${timer.total ? Math.max(0, Math.min(100, (left / timer.total) * 100)) : 0}%`;
    timerStart.textContent = timer.endAt ? 'Пауза' : (left > 0 && left < timer.total ? 'Продолжить' : 'Старт');
    timerMin.disabled = !!timer.endAt;
    publishHostState();
  }
  function finishTimer() {
    timer = { endAt: 0, remaining: 0, total: timer.total };
    saveTimer();
    renderTimer();
    showRing('Таймер', 'Время вышло. Пора сделать паузу.');
  }
  timerStart.addEventListener('click', () => {
    ensureAudio();
    if (timer.endAt) {
      timer.remaining = timerLeft();
      timer.endAt = 0;
      saveTimer();
      renderTimer();
      return;
    }
    if (timer.remaining <= 0 || timer.remaining >= timer.total) {
      const minutes = Math.max(1, Math.min(999, Number(timerMin.value) || 5));
      timer.total = minutes * 60 * 1000;
      timer.remaining = timer.total;
    }
    timer.endAt = Date.now() + timer.remaining;
    saveTimer();
    renderTimer();
  });
  document.getElementById('timer-reset').addEventListener('click', () => {
    const minutes = Math.max(1, Math.min(999, Number(timerMin.value) || 5));
    timer = { endAt: 0, remaining: minutes * 60 * 1000, total: minutes * 60 * 1000 };
    saveTimer();
    renderTimer();
  });
  setInterval(() => {
    if (timer.endAt && timerLeft() <= 0) finishTimer();
    else renderTimer();
  }, 250);
  renderTimer();

  /* ---------- будильник ---------- */
  const alarmList = document.getElementById('alarm-list');
  const alarmTime = document.getElementById('alarm-time');
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_ALARMS) || '[]');
    if (Array.isArray(saved)) alarms = saved.filter((a) => a && /^\d{2}:\d{2}$/.test(a.time || ''));
  } catch {}

  // Другая вкладка изменила будильники — подхватываем изменение.
  window.addEventListener('storage', (event) => {
    if (!event.key || event.key !== STORAGE_ALARMS) return;
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_ALARMS) || '[]');
      if (Array.isArray(saved)) alarms = saved.filter((a) => a && /^\d{2}:\d{2}$/.test(a.time || ''));
      renderAlarms();
      publishHostState();
    } catch {}
  });

  function saveAlarms() {
    try { localStorage.setItem(STORAGE_ALARMS, JSON.stringify(alarms)); } catch {}
  }
  function renderAlarms() {
    publishHostState();
    if (!alarms.length) {
      alarmList.innerHTML = '<div class="alarm-empty">Будильников нет</div>';
      return;
    }
    alarmList.innerHTML = alarms.map((alarm) => `
      <div class="alarm-row ${alarm.enabled === false ? 'off' : ''}" data-id="${esc(alarm.id || '')}">
        <span class="alarm-time">${esc(alarm.time || '')}</span>
        <span class="alarm-label">${alarm.label ? esc(alarm.label) : 'без подписи'}</span>
        <button data-alarm-toggle title="${alarm.enabled === false ? 'Включить' : 'Выключить'}">${alarm.enabled === false ? '○' : '●'}</button>
        <button data-alarm-delete title="Удалить">×</button>
      </div>
    `).join('');
    for (const row of alarmList.querySelectorAll('.alarm-row')) {
      const alarm = alarms.find((a) => a.id === row.dataset.id);
      if (!alarm) continue;
      row.querySelector('[data-alarm-toggle]').addEventListener('click', () => {
        alarm.enabled = alarm.enabled === false;
        alarm.lastFired = '';
        saveAlarms();
        renderAlarms();
      });
      row.querySelector('[data-alarm-delete]').addEventListener('click', () => {
        alarms = alarms.filter((a) => a.id !== alarm.id);
        saveAlarms();
        renderAlarms();
      });
    }
  }
  document.getElementById('alarm-add').addEventListener('click', () => {
    ensureAudio();
    const time = alarmTime.value;
    if (!/^\d{2}:\d{2}$/.test(time)) return;
    if (alarms.some((a) => a.time === time)) {
      alarmTime.focus();
      return;
    }
    alarms.push({ id: String(Date.now()) + Math.random().toString(16).slice(2), time, enabled: true, lastFired: '' });
    alarms.sort((a, b) => a.time.localeCompare(b.time));
    saveAlarms();
    renderAlarms();
  });
  setInterval(() => {
    const now = new Date();
    const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    const dayKey = `${now.getFullYear()}-${now.getMonth()}-${now.getDate()}`;
    let changed = false;
    for (const alarm of alarms) {
      if (alarm.enabled === false || alarm.time !== hhmm) continue;
      const key = dayKey + ' ' + hhmm;
      if (alarm.lastFired === key) continue;
      alarm.lastFired = key;
      changed = true;
      const fired = alarm;
      showRing('Будильник', `${alarm.time}${alarm.label ? ' · ' + alarm.label : ''}`, {
        onDisable: () => {
          fired.enabled = false;
          saveAlarms();
          renderAlarms();
          publishHostState();
        },
      });
    }
    if (changed) saveAlarms();
  }, 1000);
  renderAlarms();
  renderPresets();

  /* ---------- поиск ---------- */
  input.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    const value = input.value.trim();
    if (!value) return;
    event.preventDefault();
    if (/^https?:\/\//i.test(value)) location.href = value;
    else if (/^[\w.-]+\.[a-zа-я]{2,}(\/.*)?$/i.test(value) && !value.includes(' ')) location.href = 'https://' + value;
    else location.href = 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
  });

  /* ---------- Ссылки: редактирование / удаление ---------- */
  const STORAGE_LINKS = 'arch.newtab.links.v1';
  const linksContainer = document.getElementById('links');
  let customLinks = [];

  function loadCustomLinks() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_LINKS) || '[]');
      if (Array.isArray(saved)) customLinks = saved;
    } catch {}
    renderLinks();
  }

  function saveCustomLinks() {
    try { localStorage.setItem(STORAGE_LINKS, JSON.stringify(customLinks)); } catch {}
  }

  function getDefaultLinks() {
    return [
      { title: 'DuckDuckGo', url: 'https://duckduckgo.com/', icon: 'D' },
      { title: 'Википедия', url: 'https://ru.wikipedia.org/', icon: 'W' },
      { title: 'GitHub', url: 'https://github.com/', icon: 'G' },
      { title: 'Хабр', url: 'https://habr.com/ru/', icon: 'H' },
      { title: 'YouTube', url: 'https://www.youtube.com/', icon: '▶' },
      { title: 'Reddit', url: 'https://www.reddit.com/', icon: 'R' },
    ];
  }

  function getAllLinks() {
    const defaults = getDefaultLinks();
    const merged = [...defaults];
    for (const custom of customLinks) {
      const isDefault = defaults.some((link) => link.url === custom.url);
      const index = merged.findIndex((link) => link.url === custom.url);
      if (custom.deleted && isDefault) {
        // Удалённая ссылка из стандартного набора не показывается.
        if (index >= 0) merged.splice(index, 1);
        continue;
      }
      if (custom.deleted) continue;
      if (index >= 0) merged[index] = custom;
      else merged.push(custom);
    }
    return merged;
  }

  function renderLinks() {
    const allLinks = getAllLinks();
    linksContainer.innerHTML = allLinks.map((link, index) => `
      <div class="link-position" data-index="${index}">
        <a class="link" data-url="${esc(link.url)}" href="${esc(link.url)}">
          <span class="dot">${esc(link.icon)}</span>
          <span class="link-title">${esc(link.title)}</span>
        </a>
      </div>
    `).join('') + `
      <div class="link-position link-add-position">
        <button class="link-add" id="link-add" title="Добавить ссылку" aria-label="Добавить ссылку">+</button>
        <span class="link-add-title">Добавить</span>
      </div>
    `;
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function removeLink(link) {
    const isDefault = getDefaultLinks().some((item) => item.url === link.url);
    customLinks = customLinks.filter((item) => item.url !== link.url);
    if (isDefault) customLinks.push({ ...link, deleted: true });
    saveCustomLinks();
    renderLinks();
  }

  function confirmResetLinks() {
    return new Promise((resolve) => {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = `
        <div class="modal-card" style="width:min(390px,90vw)">
          <div class="modal-title">Сбросить ссылки?</div>
          <div class="modal-desc">Все добавленные, изменённые и удалённые ссылки будут сброшены. Вернётся стандартный набор.</div>
          <div class="modal-actions">
            <button class="mini-btn" data-reset-cancel>Отмена</button>
            <button class="mini-btn primary" data-reset-confirm>Да, сбросить</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      const close = (value) => {
        if (!overlay.isConnected) return;
        overlay.remove();
        resolve(value);
      };
      overlay.querySelector('[data-reset-cancel]').addEventListener('click', () => close(false));
      overlay.querySelector('[data-reset-confirm]').addEventListener('click', () => close(true));
      overlay.addEventListener('click', (event) => { if (event.target === overlay) close(false); });
      overlay.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') { event.preventDefault(); close(false); }
        if (event.key === 'Enter') { event.preventDefault(); close(true); }
      });
      overlay.querySelector('[data-reset-confirm]').focus();
    });
  }

  /* ---------- контекстное меню ---------- */
  let ctxMenu = null;
  function closeCtxMenu() {
    if (ctxMenu) {
      ctxMenu.remove();
      ctxMenu = null;
    }
  }

  function openCtxMenu(x, y, items) {
    closeCtxMenu();
    const menu = document.createElement('div');
    menu.className = 'ctx-menu';
    menu.setAttribute('role', 'menu');
    for (const item of items) {
      if (!item || item.sep) {
        const sep = document.createElement('div');
        sep.className = 'ctx-sep';
        menu.appendChild(sep);
        continue;
      }
      const button = document.createElement('button');
      button.className = 'ctx-item' + (item.danger ? ' danger' : '');
      button.type = 'button';
      button.setAttribute('role', 'menuitem');
      button.textContent = item.label;
      button.addEventListener('click', () => {
        closeCtxMenu();
        try { item.run(); } catch {}
      });
      menu.appendChild(button);
    }
    document.body.appendChild(menu);
    const rect = menu.getBoundingClientRect();
    menu.style.left = Math.max(8, Math.min(x, window.innerWidth - rect.width - 8)) + 'px';
    menu.style.top = Math.max(8, Math.min(y, window.innerHeight - rect.height - 8)) + 'px';
    ctxMenu = menu;
  }

  document.addEventListener('pointerdown', (event) => {
    if (ctxMenu && !ctxMenu.contains(event.target)) closeCtxMenu();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeCtxMenu();
  });
  window.addEventListener('blur', closeCtxMenu);
  window.addEventListener('scroll', closeCtxMenu, true);

  linksContainer.addEventListener('click', (event) => {
    if (event.target.closest('#link-add')) openLinkModal(null, -1);
  });

  linksContainer.addEventListener('contextmenu', (event) => {
    event.preventDefault();
    event.stopPropagation();
    const linkEl = event.target.closest('.link');
    if (linkEl) {
      const pos = linkEl.closest('.link-position');
      const index = Number(pos && pos.dataset.index);
      const link = getAllLinks()[index];
      if (!link) return;
      openCtxMenu(event.clientX, event.clientY, [
        { label: 'Открыть', run: () => { window.location.href = link.url; } },
        { label: 'Открыть в новой вкладке', run: () => window.open(link.url, '_blank', 'noopener') },
        { sep: true },
        { label: 'Редактировать…', run: () => openLinkModal(link, index) },
        { label: 'Удалить', danger: true, run: () => removeLink(link) },
      ]);
      return;
    }
    openCtxMenu(event.clientX, event.clientY, [
      { label: 'Добавить ссылку…', run: () => openLinkModal(null, -1) },
      { sep: true },
      {
        label: 'Сбросить ссылки',
        run: async () => {
          if (!(await confirmResetLinks())) return;
          customLinks = [];
          saveCustomLinks();
          renderLinks();
        },
      },
    ]);
  });

  let modalTargetIdx = -1;
  function openLinkModal(link, idx) {
    modalTargetIdx = idx;
    const editing = !!link;
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal-card">
        <div class="modal-title">${editing ? 'Редактировать ссылку' : 'Добавить ссылку'}</div>
        <div class="modal-field">
          <label>Название</label>
          <input type="text" id="modal-title" value="${esc(editing ? link.title : '')}" maxlength="32" placeholder="Например, Хабр">
        </div>
        <div class="modal-field">
          <label>URL</label>
          <input type="url" id="modal-url" value="${esc(editing ? link.url : '')}" placeholder="https://example.com">
        </div>
        <div class="modal-field">
          <label>Иконка (1-2 символа)</label>
          <input type="text" id="modal-icon" value="${esc(editing ? link.icon : '')}" maxlength="2" placeholder="★">
        </div>
        <div class="modal-error" id="modal-error"></div>
        <div class="modal-actions">
          <button class="mini-btn" id="modal-cancel">Отмена</button>
          <button class="mini-btn primary" id="modal-save">Сохранить</button>
        </div>
      </div>
    `;
    document.body.appendChild(modal);
    modal.querySelector('#modal-cancel').addEventListener('click', () => closeModal(modal));
    modal.querySelector('#modal-save').addEventListener('click', () => saveModal(modal));
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(modal); });
    modal.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); saveModal(modal); }
      if (e.key === 'Escape') { e.preventDefault(); closeModal(modal); }
    });
    const titleInput = modal.querySelector('#modal-title');
    titleInput.focus();
    titleInput.select();
  }

  function closeModal(modal) {
    modal.remove();
    modalTargetIdx = -1;
  }

  function saveModal(modal) {
    const title = modal.querySelector('#modal-title').value.trim();
    const rawUrl = modal.querySelector('#modal-url').value.trim();
    const icon = modal.querySelector('#modal-icon').value.trim() || '★';
    const errorEl = modal.querySelector('#modal-error');
    const fail = (text) => {
      errorEl.textContent = text;
    };
    if (!title) return fail('Укажите название');
    if (!rawUrl) return fail('Укажите адрес');
    if (/\s/.test(rawUrl)) return fail('\u0410\u0434\u0440\u0435\u0441 \u043d\u0435 \u0434\u043e\u043b\u0436\u0435\u043d \u0441\u043e\u0434\u0435\u0440\u0436\u0430\u0442\u044c \u043f\u0440\u043e\u0431\u0435\u043b\u044b');
    let url = /^https?:\/\//i.test(rawUrl) ? rawUrl : 'https://' + rawUrl;
    try {
      const parsed = new URL(url);
      if (!parsed.hostname) return fail('\u041d\u0435\u043a\u043e\u0440\u0440\u0435\u043a\u0442\u043d\u044b\u0439 \u0430\u0434\u0440\u0435\u0441');
      url = parsed.href;
      if (!/^https?:$/.test(parsed.protocol)) return fail('Адрес должен начинаться с http:// или https://');
    } catch {
      return fail('Некорректный адрес');
    }
    const allLinks = getAllLinks();
    const original = modalTargetIdx >= 0 ? allLinks[modalTargetIdx] : null;
    const duplicate = allLinks.find((item) => item.url === url && item !== original);
    if (duplicate) return fail('Такая ссылка уже есть');

    if (original) {
      const isDefault = getDefaultLinks().some((item) => item.url === original.url);
      if (isDefault) {
        customLinks = customLinks.filter((item) => item.url !== original.url && item.url !== url);
        // Если стандартную ссылку переименовали и сменили адрес, старый
        // адрес скрываем.
        if (original.url !== url) customLinks.push({ ...original, deleted: true });
        customLinks.push({ title, url, icon });
      } else {
        customLinks = customLinks.map((item) => (
          item.url === original.url ? { ...item, title, url, icon, deleted: false } : item
        ));
      }
    } else {
      customLinks.push({ title, url, icon });
    }
    saveCustomLinks();
    closeModal(modal);
    renderLinks();
  }

  /* Контекстное меню на пустом месте: добавить ссылку или сбросить набор. */
  document.addEventListener('contextmenu', (e) => {
    if (e.defaultPrevented) return;
    const el = e.target;
    const tag = (el && el.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (el && el.isContentEditable)) return;
    e.preventDefault();
    openCtxMenu(e.clientX, e.clientY, [
      { label: 'Добавить ссылку…', run: () => openLinkModal(null, -1) },
      { sep: true },
      {
        label: 'Сбросить ссылки',
        run: async () => {
          if (!(await confirmResetLinks())) return;
          customLinks = [];
          saveCustomLinks();
          renderLinks();
        },
      },
    ]);
  });
  document.addEventListener('keydown', (e) => {
    // Внимание: каждая комбинация в скобках целиком — иначе, например,
    // «e.key === 'u'» без Ctrl перехватывает обычную букву.
    const blocked =
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) ||
      (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u'));
    if (blocked) e.preventDefault();
  });

  loadCustomLinks();
</script>
</body>
</html>
