<div id="boot" class="boot">
  <div class="boot-glow"></div>
  <div class="boot-logo"><img src="../../assets/icon.png" alt="ArchBrowser" draggable="false"></div>
  <div class="boot-title">ArchBrowser</div>
  <div class="boot-phase" id="boot-phase">Запуск…</div>
  <div class="boot-track"><div id="boot-bar"></div></div>
  <div class="boot-hint">Приватный браузер · расширения и защита загружаются</div>
</div>

<div id="chrome">
  <div id="tabstrip">
    <div id="tabs"></div>
    <button id="new-tab-btn" class="icon-btn tab-plus" title="Новая вкладка (Ctrl+T)">
      <svg class="icon"><use href="#i-plus"/></svg>
    </button>
    <div class="tabstrip-spacer"></div>
    <div class="titlebar-controls-space"></div>
  </div>

  <div id="toolbar">
    <div class="toolbar-group toolbar-left">
      <button id="back" class="icon-btn nav" title="Назад (Alt+←)" disabled>
        <svg class="icon"><use href="#i-back"/></svg>
      </button>
      <button id="forward" class="icon-btn nav" title="Вперёд (Alt+→)" disabled>
        <svg class="icon"><use href="#i-forward"/></svg>
      </button>
      <button id="reload" class="icon-btn nav" title="Обновить (Ctrl+R)">
        <svg class="icon" id="reload-icon"><use href="#i-reload"/></svg>
      </button>
    </div>

    <div id="omnibox-wrap">
      <span id="security-icon" class="security-icon" title="Соединение">
        <svg class="icon"><use href="#i-shield"/></svg>
      </span>
      <input id="omnibox" type="text" autocomplete="off" spellcheck="false"
             placeholder="Введите адрес или поисковый запрос">
      <button id="blocked-chip" class="blocked-chip hidden" title="Заблокированные трекеры">
        <svg class="icon"><use href="#i-shield"/></svg>
        <span id="blocked-count">0</span>
      </button>
      <button id="star" class="icon-btn star" title="Добавить в закладки (Ctrl+D)">
        <svg class="icon"><use href="#i-star"/></svg>
      </button>
      <button id="bookmarks-bar-btn" class="icon-btn bar-toggle" title="Панель закладок">
        <svg class="icon"><use href="#i-bookmark"/></svg>
      </button>
      <button id="reader-btn" class="icon-btn" title="Режим чтения (Alt+R)">
        <svg class="icon"><use href="#i-reader"/></svg>
      </button>
    </div>

    <div class="toolbar-group toolbar-right">
      <button id="toolbar-collapse" class="icon-btn toolbar-toggle" title="Скрыть кнопки справа">
        <svg class="icon"><use href="#i-chevron-right"/></svg>
      </button>
      <button id="timer-chip" class="timer-chip hidden" title="Таймер">
        <svg class="icon"><use href="#i-timer"/></svg>
        <span id="timer-chip-label">00:00</span>
      </button>
      <button id="alarm-chip" class="timer-chip alarm hidden" title="Будильник">
        <svg class="icon"><use href="#i-alarm"/></svg>
        <span id="alarm-chip-label">07:00</span>
      </button>
      <button id="vpn-chip" class="vpn-chip" title="VPN">
        <span class="vpn-dot"></span>
        <span id="vpn-chip-label">VPN</span>
      </button>
      <button id="opencode-btn" class="icon-btn" title="OpenCode — ИИ-агент в браузере">
        <svg class="icon"><use href="#i-code"/></svg>
      </button>
      <button id="telegram-btn" class="icon-btn telegram-btn" title="Telegram (Ctrl+Shift+M)">
        <svg class="icon"><use href="#i-telegram"/></svg>
        <span id="telegram-badge" class="badge count hidden"></span>
      </button>
      <button id="split-btn" class="icon-btn" title="Разделить экран (Ctrl+Shift+E)">
        <svg class="icon"><use href="#i-split"/></svg>
      </button>
      <button id="share-btn" class="icon-btn" title="Поделиться страницей">
        <svg class="icon"><use href="#i-share"/></svg>
      </button>
      <button id="player-btn" class="icon-btn" title="Плеер (локальные файлы)">
        <svg class="icon"><use href="#i-music"/></svg>
      </button>
      <button id="torrent-btn" class="icon-btn" title="BitTorrent-клиент">
        <svg class="icon"><use href="#i-torrent"/></svg>
      </button>
      <button id="downloads-btn" class="icon-btn" title="Загрузки (Ctrl+J)">
        <svg class="icon"><use href="#i-download"/></svg>
        <span id="download-badge" class="badge hidden"></span>
      </button>
      <button id="fullscreen-btn" class="icon-btn" title="Полный экран (F11)">
        <svg class="icon"><use href="#i-fullscreen"/></svg>
      </button>
      <button id="extensions-btn" class="icon-btn" title="Расширения">
        <svg class="icon"><use href="#i-puzzle"/></svg>
      </button>
      <button id="toolbar-expand" class="icon-btn toolbar-toggle hidden" title="Показать кнопки справа">
        <svg class="icon"><use href="#i-chevron-left"/></svg>
      </button>
      <button id="menu-btn" class="icon-btn" title="Меню">
        <svg class="icon"><use href="#i-menu"/></svg>
      </button>
    </div>
  </div>

  <div id="dock" class="hidden"></div>
  <div id="bookmarks-bar" class="hidden"></div>

  <!-- Пульт управления воспроизведением. -->
  <div id="media-bar" class="hidden">
    <button id="media-bar-prev" class="icon-btn" title="Предыдущий">
      <svg class="icon"><use href="#i-prev"/></svg>
    </button>
    <button id="media-bar-toggle" class="icon-btn" title="Играть / пауза">
      <svg class="icon"><use href="#i-play"/></svg>
    </button>
    <button id="media-bar-next" class="icon-btn" title="Следующий">
      <svg class="icon"><use href="#i-next"/></svg>
    </button>
    <button id="media-bar-shuffle" class="icon-btn" title="Перемешивание">
      <svg class="icon"><use href="#i-shuffle"/></svg>
    </button>
    <button id="media-bar-repeat" class="icon-btn" title="Повтор">
      <svg class="icon"><use href="#i-repeat"/></svg>
    </button>
    <div class="media-bar-info">
      <div id="media-bar-title" class="media-bar-title"></div>
      <div id="media-bar-time" class="media-bar-time"></div>
    </div>
    <input id="media-bar-seek" class="media-bar-seek" type="range" min="0" max="1" step="0.001" value="0">
    <div id="media-bar-volume-wrap" class="media-bar-volume">
      <button id="media-bar-mute" class="icon-btn" title="Звук">
        <svg class="icon"><use href="#i-volume"/></svg>
      </button>
      <input id="media-bar-volume" class="media-bar-volume-range" type="range" min="0" max="1" step="0.01" value="1" title="Громкость">
    </div>
    <button id="media-bar-close" class="icon-btn" title="Остановить и закрыть плеер">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
  </div>
</div>

<div id="panel" class="hidden">
  <div id="panel-head">
    <div id="panel-title-wrap">
      <span id="panel-icon"></span>
      <h1 id="panel-title">Настройки</h1>
    </div>
    <button id="panel-close" class="icon-btn" title="Закрыть (Esc)">
      <svg class="icon"><use href="#i-close"/></svg>
    </button>
  </div>
  <div id="panel-body"></div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- Невидимый проигрыватель локальных файлов. -->
<audio id="player-audio" preload="metadata"></audio>

<script src="app.js"></script>
</body>
</html>
