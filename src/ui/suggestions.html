<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'none'; img-src data:;">
<title>Подсказки</title>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 3v6h6"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
</svg>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    height: auto;
    overflow: hidden;
    background: transparent;
    user-select: none;
  }
  body { padding: 0; }
  #list {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: 0 18px 40px var(--shadow);
    overflow: hidden;
    max-height: 420px;
    overflow-y: auto;
  }
  .suggest-row {
    height: 40px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    color: var(--text-soft);
    cursor: default;
    border-bottom: 1px solid var(--border-soft);
  }
  .suggest-row:last-child { border-bottom: 0; }
  .suggest-row:hover, .suggest-row.selected { background: var(--surface-3); }
  .suggest-row .icon { width: 15px; height: 15px; color: var(--muted); }
  .suggest-main { flex: 1; min-width: 0; }
  .suggest-title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggest-url { font-size: 11px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggest-action { font-size: 11px; color: var(--accent); flex: none; }
</style>
</head>
<body>
<div id="list"></div>
<script src="preload-suggest.js"></script>
</body>
</html>
