name: Build macOS ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Xray for macOS arm64
        run: |
          mkdir -p resources/xray
          # Закреплена v26.6.27: с v26.7.11 Xray запрещает VLESS без TLS на
          # публичный адрес (см. scripts/build-mac-arm64.sh).
          curl -L --fail -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v26.6.27/Xray-macos-arm64-v8a.zip"
          unzip -o /tmp/xray.zip -d /tmp/xray
          cp /tmp/xray/xray resources/xray/xray
          chmod +x resources/xray/xray
          xattr -dr com.apple.quarantine resources/xray/xray || true

      - name: Build DMG
        run: npm run dist:mac

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ArchBrowser-macOS-arm64
          path: dist/*.dmg
          if-no-files-found: error
